name: poll-vf-numbers

on:
  schedule:
    # Every 30 minutes, offset from the hour to reduce scheduler drops.
    #
    # Not more often: fully enumerating the carriers costs ~4,000 requests a run (WE
    # alone needs ~3,500, since it hands over only 51 numbers per request and caps any
    # single query at 20,000). Polling every 10 minutes throttled our IP twice during
    # development. Premium numbers do not appear minute-to-minute, so 30 min is the
    # trade; drop to hourly if WE starts refusing connections again.
    - cron: "7,37 * * * *"
  push:
    branches: [main]
    paths: ["web/**", "src/**", ".github/workflows/poll.yml"]
  workflow_dispatch:
    inputs:
      regrade:
        description: "Re-evaluate ALL numbers (bypass the LLM grade cache)"
        type: boolean
        default: false

# Never let two runs race the gh-pages push.
concurrency:
  group: poll
  # Keep the freshest poll if one run stalls and overlaps the next schedule tick.
  cancel-in-progress: true

permissions:
  contents: write
  issues: write
  models: read

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 20  # a full poll is ~5 min, almost all of it WE pagination
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run pipeline
        id: run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          # All state lives in Postgres; the run writes no files at all.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          ALERT_EMAIL_FROM: ${{ vars.ALERT_EMAIL_FROM }}
          MODEL: openai/gpt-4o-mini
          # Manual "Run workflow" with regrade=true forces a full re-evaluation.
          REGRADE: ${{ github.event.inputs.regrade == 'true' && '1' || '0' }}
        run: node src/run.js

      # The dashboard is static and reads Postgres directly, so it only needs
      # republishing when its own files change — never on a scheduled poll.
      - name: Publish dashboard to gh-pages
        if: github.event_name != 'schedule'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages --depth=1
            git worktree add public origin/gh-pages
          else
            git worktree add --detach public
            git -C public checkout --orphan gh-pages
            git -C public reset --hard
            git -C public clean -fdx
          fi
          # Drop the JSON snapshots the dashboard used to download; they are superseded
          # by live queries and would otherwise sit there stale forever.
          rm -f public/latest.json public/history.json public/best-ever.json \
                public/index.json public/events.jsonl.json public/grades.json \
                public/signature.txt public/styles.css
          cp web/index.html web/status.html web/app.js web/db.js web/config.js web/tailwind.css public/
          touch public/.nojekyll
          cd public
          git add -A
          if git diff --cached --quiet; then
            echo "dashboard unchanged"
          else
            git commit -m "dashboard: update $(date -u +%FT%TZ) [skip ci]"
            git push origin HEAD:gh-pages
          fi
