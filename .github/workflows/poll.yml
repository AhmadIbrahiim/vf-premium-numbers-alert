name: poll-vf-numbers

on:
  schedule:
    # Every 30 minutes, offset from the hour to reduce scheduler drops.
    #
    # Not more often: fully enumerating the carriers costs ~4,000 requests a run (WE
    # alone needs ~3,500, since it hands over only 51 numbers per request and caps any
    # single query at 20,000). Polling every 10 minutes throttled our IP twice during
    # development. Premium numbers do not appear minute-to-minute, so 30 min is the
    # trade; drop to hourly if WE starts refusing connections again.
    - cron: "7,37 * * * *"
  push:
    branches: [main]
    paths: ["web/**", "src/**", ".github/workflows/poll.yml"]
  workflow_dispatch:
    inputs:
      regrade:
        description: "Re-evaluate ALL numbers (bypass the LLM grade cache)"
        type: boolean
        default: false

# Never let two runs race the gh-pages push.
concurrency:
  group: poll
  # Keep the freshest poll if one run stalls and overlaps the next schedule tick.
  cancel-in-progress: true

permissions:
  contents: write
  issues: write
  models: read

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 20  # a full poll is ~5 min, almost all of it WE pagination
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Prepare gh-pages working copy (public/)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages --depth=1
            git worktree add public origin/gh-pages
          else
            git worktree add --detach public
            git -C public checkout --orphan gh-pages
            git -C public reset --hard
            git -C public clean -fdx
          fi

      - name: Run pipeline
        id: run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          # Number state lives in Neon Postgres; the run refuses to start without it.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # Email alerts (optional): unset means the run just skips the email.
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          ALERT_EMAIL_FROM: ${{ vars.ALERT_EMAIL_FROM }}
          DATA_DIR: public
          MODEL: openai/gpt-4o-mini
          # Manual "Run workflow" with regrade=true forces a full re-evaluation.
          REGRADE: ${{ github.event.inputs.regrade == 'true' && '1' || '0' }}
        run: node src/run.js

      - name: Copy dashboard into public/
        run: |
          cp web/index.html web/app.js web/tailwind.css public/
          rm -f public/styles.css
          # Superseded by Postgres + best-ever.json/index.json; drop the stale 13MB blob.
          rm -f public/history.json
          touch public/.nojekyll

      - name: Commit & push to gh-pages
        if: steps.run.outputs.changed == 'true' || github.event_name != 'schedule'
        run: |
          cd public
          git add -A
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "data: update $(date -u +%FT%TZ) [skip ci]"
            git push origin HEAD:gh-pages
          fi
