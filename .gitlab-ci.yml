# GitLab CI — runs the poller. The dashboard is deployed by Vercel, not from here.
#
# Three jobs:
#   test         — on pushes and merge requests. No install step: the poller has no
#                  dependencies, so `node --test` runs against plain Node.
#   poll         — on a pipeline schedule (or a manual run). Fetches all three carriers
#                  and writes to Postgres.
#   check-stale  — on its own schedule. Emails if no poll has landed recently.
#
# The schedules are NOT defined in this file. GitLab keeps pipeline schedules in
# project settings: CI/CD → Schedules. Two are needed:
#
#   1. cron `7,37 * * * *`, target `main`  — runs `poll` (every 30 minutes)
#   2. cron `23 * * * *`,   target `main`, variable `CHECK_STALE=1`
#                                          — runs `check-stale` (hourly)
#
# Without (1) the poller never runs on its own, and for most of this project's life it
# did not: every recorded poll had been triggered by hand. Nothing said so, because the
# dashboard keeps serving the last numbers it collected. (2) exists to make that state
# announce itself, which is why it is a separate schedule and a separate job — a check
# that runs inside the poll job reports nothing when the poll job is what is broken.

# Pinned to the runtime the test suite is actually exercised against. Bumping this is
# fine but re-run `node --test` first — the poller leans on undici behaviour (connect
# timeouts against a throttling carrier) that has changed between majors.
image: node:20-alpine

stages:
  - test
  - poll
  - check

test:
  stage: test
  script:
    - node --version
    - node --test
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "push"

poll:
  stage: poll
  # A full poll is 3-5 minutes, almost all of it WE pagination. The ceiling is generous
  # because a throttled carrier makes it slower, not faster.
  timeout: 20 minutes
  # Never let two polls hit the carriers — or write the database — at once. Concurrent
  # runs are how the WE IP throttle gets triggered.
  resource_group: poll
  interruptible: false
  variables:
    # Kept low deliberately: 8-way WE concurrency got this IP throttled twice.
    WE_CONCURRENCY: "4"
  # Optional CI/CD variables, all masked:
  #   RESEND_API_KEY, ALERT_EMAIL_TO, DASHBOARD_URL  — email alerts
  #   LLM_BASE_URL, LLM_API_KEY, MODEL              — LLM grading (any
  #     OpenAI-compatible API; GitHub Models was retired 2026-07-30)
  #   GITHUB_TOKEN                                   — GitHub Issue alerts only
  script:
    - |
      if [ -z "$DATABASE_URL" ]; then
        echo "DATABASE_URL is not set. Add it under Settings -> CI/CD -> Variables"
        echo "(masked, and NOT 'protected' unless this branch is protected)."
        exit 1
      fi
    - node src/run.js
  rules:
    # The staleness schedule sets CHECK_STALE, and must never trigger a poll — that
    # would both double the carrier load and defeat the check by refreshing the very
    # timestamp it is about to read.
    - if: $CHECK_STALE
      when: never
    # `schedule` is the cron pipeline; `web` is the Run pipeline button.
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"

# Dead-man's switch for the poller. One query, no carrier requests, so it is cheap to
# run often. Exits non-zero when stale, so the pipeline goes red as well as sending
# mail — two independent signals, and a red pipeline is visible without opening email.
check-stale:
  stage: check
  timeout: 5 minutes
  script:
    - |
      if [ -z "$DATABASE_URL" ]; then
        echo "DATABASE_URL is not set. Add it under Settings -> CI/CD -> Variables"
        exit 1
      fi
    - node src/check-stale.js
  rules:
    - if: $CHECK_STALE
