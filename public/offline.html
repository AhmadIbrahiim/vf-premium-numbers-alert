<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Offline — Egypt Premium Numbers</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: #fafafa; color: #111827; padding: 24px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) { body { background: #08080a; color: #f4f4f5; } }
  main { max-width: 22rem; text-align: center; }
  .mark {
    width: 44px; height: 44px; border-radius: 10px; background: #e60000; color: #fff;
    display: grid; place-items: center; font-weight: 800; margin: 0 auto 18px;
  }
  h1 { font-size: 17px; margin: 0 0 8px; }
  p { font-size: 14px; line-height: 1.55; color: #6b7280; margin: 0 0 18px; }
  button {
    font: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    padding: 9px 18px; border-radius: 8px; border: 1px solid #d4d4d8;
    background: transparent; color: inherit;
  }
</style>
</head>
<body>
<main>
  <div class="mark">EG</div>
  <h1>You're offline</h1>
  <!-- Deliberately no cached numbers: every figure here is read live from the
       database, and a stale price-like number is worse than none. -->
  <p>
    The numbers are read live, so there is nothing useful to show without a connection.
    Reconnect and try again.
  </p>
  <button type="button" id="retry">Try again</button>
</main>
<script>
  // Reload automatically the moment connectivity returns.
  addEventListener("online", () => location.reload());
  document.getElementById("retry").addEventListener("click", () => location.reload());
</script>
</body>
</html>
